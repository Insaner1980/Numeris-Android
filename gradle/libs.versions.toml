[versions]
agp = "9.2.1"
kotlin = "2.4.10"
compose-ui = "1.11.4"
material3 = "1.4.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
detekt = "2.0.0-alpha.5"
ktlint-plugin = "14.2.0"
composeRules = "0.6.3"
owasp-dependency-check = "12.2.2"
room3 = "3.0.0"
sqlite = "2.7.0"
ksp = "2.3.9"
biometric = "1.1.0"
okhttp = "5.4.0"
