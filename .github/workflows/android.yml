name: Android

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build all declared modules
        run: ./gradlew assembleDebug build --no-daemon --console=plain
      - name: Run unit tests and static checks
        run: ./gradlew test lint detektCheck ktlintCheck --no-daemon --console=plain
      - name: Verify included build logic
        run: ./gradlew -p build-logic build test --no-daemon --console=plain
